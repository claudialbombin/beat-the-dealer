[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-mc"
version = "1.0.0"
description = "Blackjack basic strategy by Monte Carlo, checked against an exact solver, plus Hi-Lo counting analysis"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Claudia María López Bombín" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blackjack-mc = "blackjack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
